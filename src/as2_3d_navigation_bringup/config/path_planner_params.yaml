/*/path_planner:
  ros__parameters:
    # No competition map is defined in the package defaults.
    # Real deployments use launchers/real/config/path_planner_params.yaml.
    map_file: ""

    # Planning domain
    map.bounds_padding: 0.0
    map.min_z: 0.0
    map.floor_clearance: 0.15

    planner.use_jps3d: true

    jps.inflation_radius: 0.30
    jps.map_update_rate: 0

    snap.enabled: true
    snap.total_time: 6.0
    snap.sample_dt: 0.15
    snap.chunk_size: 4
    snap.max_vel: 1.5
    snap.max_acc: 2.0

    astar.max_iterations: 500000
    astar.inflation_radius: 0.30
    astar.allow_diagonal: true
    astar.w_heuristic: 1.0
